---
layout: default
---
<header class="page-head">
  <div class="wrap">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</header>
<article class="wrap prose">
  {{ content }}
</article>
