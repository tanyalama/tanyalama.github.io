# Site settings — edit these first
title: Wildlife Genomics Lab
subtitle: Smith College
description: >-
  The Wildlife Genomics Lab at Smith College, led by Dr. Tanya M. Lama, uses
  comparative and population genomics to study how life history traits such as
  lifespan and body size shape evolutionary responses to environmental change.
url: "https://tanyalama.github.io"
baseurl: ""
lang: en

author:
  name: Tanya M. Lama
  email: tlama@smith.edu
  github: tanyalama
  twitter: tanyalama   # leave blank to hide

# Optional profile links (leave blank to hide)
links:
  google_scholar: ""
  orcid: ""
  bluesky: ""
  hackmd: "https://hackmd.io/@tlama/aboutme"

# Put a public CV at assets/cv/Lama_CV.pdf and it will be linked automatically
cv_pdf: /assets/cv/Lama_CV.pdf

nav:
  - { title: Research,     url: /research/ }
  - { title: Publications, url: /publications/ }
  - { title: People,       url: /people/ }
  - { title: Teaching,     url: /teaching/ }
  - { title: Outreach,     url: /outreach/ }
  - { title: Join,         url: /join/ }

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - ReadMe.md
  - README.md
  - License.md
  - vendor
  - .bundle
